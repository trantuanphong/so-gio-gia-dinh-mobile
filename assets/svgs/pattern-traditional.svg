<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <pattern id="dongson-cloud" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <!-- Mây cổ khúc khuỷu / Sóng nước hoa văn Đông Sơn -->
      <path d="M 10 50 Q 25 30, 40 50 T 70 50 T 100 50" fill="none" stroke="#c59b27" stroke-width="1.2" stroke-opacity="0.18" />
      <path d="M 0 25 Q 15 5, 30 25 T 60 25 T 90 25" fill="none" stroke="#c59b27" stroke-width="1" stroke-opacity="0.12" />
      <path d="M 20 75 Q 35 55, 50 75 T 80 75 T 110 75" fill="none" stroke="#c59b27" stroke-width="1" stroke-opacity="0.12" />
      
      <!-- Họa tiết chữ Thọ / Vòng lặp gấm truyền thống -->
      <circle cx="50" cy="50" r="12" fill="none" stroke="#c59b27" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="3 2" />
      <circle cx="50" cy="50" r="6" fill="none" stroke="#c59b27" stroke-width="0.8" stroke-opacity="0.15" />
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#dongson-cloud)" />
</svg>
